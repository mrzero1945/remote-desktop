<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   width="1540"
   height="480"
   viewBox="0 0 1540 480"
   version="1.1"
   id="remote-desktop-logo"
   inkscape:version="1.4.2 (ebf0e940d0, 2025-05-08)"
   sodipodi:docname="remote-desktop-logo.svg">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#666666"
     borderopacity="1.0"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     showgrid="false" />
  <title id="title1">Remote Desktop — logo lockup (light background)</title>
  <desc id="desc1">Horizontal lockup for light surfaces: app mark on the left, dark wordmark and deeper accent on the right.</desc>

  <defs id="defs1">
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:#0E1728" id="stop-bg0" />
      <stop offset="1" style="stop-color:#1C2B47" id="stop-bg1" />
    </linearGradient>
    <linearGradient id="bgSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:#FFFFFF;stop-opacity:0.07" id="stop-bgs0" />
      <stop offset="0.45" style="stop-color:#FFFFFF;stop-opacity:0" id="stop-bgs1" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:#3A4868" id="stop-fr0" />
      <stop offset="1" style="stop-color:#0B1220" id="stop-fr1" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" style="stop-color:#05080F" id="stop-sc0" />
      <stop offset="1" style="stop-color:#0D182A" id="stop-sc1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:#06B6D4" id="stop-ac0" />
      <stop offset="1" style="stop-color:#2563EB" id="stop-ac1" />
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" style="stop-color:#FFFFFF;stop-opacity:0.12" id="stop-sh0" />
      <stop offset="0.55" style="stop-color:#FFFFFF;stop-opacity:0" id="stop-sh1" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" style="stop-color:#22D3EE;stop-opacity:0.20" id="stop-gl0" />
      <stop offset="0.6" style="stop-color:#3B82F6;stop-opacity:0.08" id="stop-gl1" />
      <stop offset="1" style="stop-color:#3B82F6;stop-opacity:0" id="stop-gl2" />
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" id="blur1" />
    </filter>
  </defs>

  <g inkscape:groupmode="layer" inkscape:label="Mark" id="layer-mark">
    <g id="icon-mark" transform="translate(30,40) scale(0.390625)">
      <rect id="tile" x="0" y="0" width="1024" height="1024" rx="232" ry="232" style="fill:url(#bgGrad)" />
      <rect id="tile-sheen" x="0" y="0" width="1024" height="1024" rx="232" ry="232" style="fill:url(#bgSheen)" />
      <ellipse id="halo" cx="512" cy="430" rx="350" ry="300" style="fill:url(#glow)" />
      <rect id="neck" x="470" y="668" width="84" height="90" rx="16" ry="16" style="fill:url(#frameGrad)" />
      <rect id="base" x="380" y="756" width="264" height="52" rx="26" ry="26" style="fill:#1B2740" />
      <rect id="base-accent" x="416" y="764" width="192" height="10" rx="5" ry="5" style="fill:url(#accentGrad);fill-opacity:0.9" />
      <rect id="frame" x="176" y="168" width="672" height="504" rx="60" ry="60" style="fill:url(#frameGrad);stroke:url(#accentGrad);stroke-width:3;stroke-opacity:0.55" />
      <rect id="screen" x="216" y="206" width="592" height="428" rx="40" ry="40" style="fill:url(#screenGrad);stroke:#38BDF8;stroke-width:3;stroke-opacity:0.28" />
      <g id="glyph-glow" style="filter:url(#softGlow)">
        <path id="glow-arc1" d="M 452 426 A 68 68 0 0 1 520 494" style="fill:none;stroke:url(#accentGrad);stroke-width:20;stroke-linecap:round;stroke-opacity:0.55" />
        <path id="glow-arc2" d="M 452 359 A 135 135 0 0 1 587 494" style="fill:none;stroke:url(#accentGrad);stroke-width:20;stroke-linecap:round;stroke-opacity:0.55" />
      </g>
      <g id="glyph" style="fill:none;stroke:url(#accentGrad);stroke-width:22;stroke-linecap:round">
        <path id="arc1" d="M 452 426 A 68 68 0 0 1 520 494" />
        <path id="arc2" d="M 452 359 A 135 135 0 0 1 587 494" />
      </g>
      <circle id="glyph-dot" cx="452" cy="494" r="21" style="fill:url(#accentGrad)" />
      <rect id="screen-sheen" x="216" y="206" width="592" height="428" rx="40" ry="40" style="fill:url(#sheenGrad)" />
    </g>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="Wordmark" id="layer-wordmark">
    <text
       id="wordmark"
       x="500"
       y="252"
       style="font-family:'Lato','Cantarell',sans-serif;font-weight:900;font-size:132px;letter-spacing:1px"
       xml:space="preserve"><tspan id="wm-remote" style="fill:#0E1728">Remote</tspan><tspan id="wm-desktop" style="fill:url(#accentGrad)"> Desktop</tspan></text>
    <rect id="tag-bar" x="502" y="305" width="52" height="9" rx="4.5" ry="4.5" style="fill:url(#accentGrad)" />
    <text
       id="tagline"
       x="576"
       y="322"
       style="font-family:'Lato','Cantarell',sans-serif;font-weight:500;font-size:34px;letter-spacing:8px;fill:#0B7285"
       xml:space="preserve">STREAM · CONTROL · ANYWHERE</text>
  </g>
</svg>
